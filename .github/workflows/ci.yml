name: CI

on:
  push:
  pull_request:
    branches:
      - mb_2

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API NestJS
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: change-me-dev-password
        options: >-
          --health-cmd "mongosh --quiet -u root -p change-me-dev-password --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: services/api
    env:
      MONGO_URI: mongodb://root:change-me-dev-password@localhost:27017/healthia?authSource=admin
      JWT_SECRET: ci-development-secret
      AI_SERVICE_URL: http://localhost:8001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: E2E tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

  ai-service:
    name: AI service FastAPI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    env:
      AI_SERVICE_MONGO_ENABLED: "false"
      AI_SERVICE_VISION_ENABLED: "false"
      VISION_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ai-service/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check app scripts

      - name: Tests
        run: python -m pytest

  ai-quality:
    name: AI quality gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    env:
      AI_SERVICE_MONGO_ENABLED: "false"
      AI_SERVICE_VISION_ENABLED: "false"
      VISION_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/ai-service/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: AI quality gates
        run: python -m pytest app/tests/test_ai_quality_gates.py

  web:
    name: Web React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      VITE_AI_API_URL: http://localhost:8000
      VITE_USE_MOCKS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build

  docker-compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config
