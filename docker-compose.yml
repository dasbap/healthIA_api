services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "${MONGODB_HOST_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-rootpassword}

  ai-service:
    build:
      context: ./services/ai-service
      args:
        AI_SERVICE_VISION_MODEL_ID: ${AI_SERVICE_VISION_MODEL_ID:-nateraw/food}
    container_name: healthia-ai-service
    depends_on:
      - mongodb
    ports:
      - "${AI_SERVICE_HOST_PORT:-8001}:8001"
    environment:
      AI_SERVICE_ENVIRONMENT: ${AI_SERVICE_ENVIRONMENT:-docker}
      AI_SERVICE_MONGO_ENABLED: ${AI_SERVICE_MONGO_ENABLED:-true}
      AI_SERVICE_MONGO_URI: ${AI_SERVICE_MONGO_URI:-mongodb://root:rootpassword@mongodb:27017}
      AI_SERVICE_MONGO_DB: ${AI_SERVICE_MONGO_DB:-healthia}
      AI_SERVICE_MONGO_TIMEOUT_MS: ${AI_SERVICE_MONGO_TIMEOUT_MS:-1200}
      AI_SERVICE_SERVICE_TOKEN: ${AI_SERVICE_SERVICE_TOKEN:-local-service-token}

  api:
    build:
      context: ./services/api
    container_name: healthia-api
    depends_on:
      - mongodb
      - ai-service
    ports:
      - "${API_HOST_PORT:-13000}:${API_PORT:-3000}"
    environment:
      API_PORT: ${API_PORT:-3000}
      MONGO_URI: ${MONGO_URI:-mongodb://root:rootpassword@mongodb:27017/healthia?authSource=admin}
      JWT_SECRET: ${JWT_SECRET:-development-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8001}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-local-service-token}

volumes:
  mongodb_data:
    driver: local
