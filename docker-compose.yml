services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword

  ai-service:
    build:
      context: ./services/ai-service
      args:
        AI_SERVICE_INSTALL_VISION: ${AI_SERVICE_INSTALL_VISION:-false}
        AI_SERVICE_VISION_MODEL_ID: ${AI_SERVICE_VISION_MODEL_ID:-nateraw/food}
    container_name: healthai-ai-service
    ports:
      - "${AI_SERVICE_HOST_PORT:-8000}:8000"
    depends_on:
      - mongodb
    environment:
      AI_SERVICE_ENVIRONMENT: ${AI_SERVICE_ENVIRONMENT:-docker}
      AI_SERVICE_MONGO_ENABLED: ${AI_SERVICE_MONGO_ENABLED:-true}
      AI_SERVICE_MONGO_URI: ${AI_SERVICE_MONGO_URI:-mongodb://root:rootpassword@mongodb:27017}
      AI_SERVICE_MONGO_DB: ${AI_SERVICE_MONGO_DB:-healthia}
      AI_SERVICE_MONGO_TIMEOUT_MS: ${AI_SERVICE_MONGO_TIMEOUT_MS:-1200}
      AI_SERVICE_SERVICE_TOKEN: ${AI_SERVICE_SERVICE_TOKEN:-}
      AI_SERVICE_CORS_ORIGINS: ${AI_SERVICE_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      AI_SERVICE_VISION_ENABLED: ${VISION_ENABLED:-false}
      AI_SERVICE_VISION_MODEL_NAME: ${VISION_MODEL_NAME:-nateraw/food}
      AI_SERVICE_VISION_DEVICE: ${VISION_DEVICE:-cpu}
      AI_SERVICE_VISION_MODEL_PATH: ${AI_SERVICE_VISION_MODEL_PATH:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5

  nestjs:
    profiles:
      - backend-placeholder
    build:
      context: ./nestjs
    container_name: nestjs
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
      - ai-service

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    network_mode: host
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
      - "--web.listen-address=:9116"
    volumes:
      - ./monitoring/blackbox/blackbox.yml:/etc/blackbox_exporter/config.yml:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    network_mode: host
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.listen-address=:9091"
      - "--web.enable-lifecycle"
    depends_on:
      - blackbox-exporter

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: 3002
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  mongodb_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
