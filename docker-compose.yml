version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example

  fastapi:
    build:
      context: ./fastapi
    container_name: fastapi
    ports:
      - "8000:8000"
    depends_on:
      - mongodb

  nestjs:
    build:
      context: ./nestjs
    container_name: nestjs
    ports:
      - "3000:3000"
    depends_on:
      - mongodb
      - fastapi

volumes:
  mongodb_data:
    driver: local