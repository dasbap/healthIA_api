services:
  mongodb:
    image: mongo:6.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword

  ai-service:
    build:
      context: ./services/ai-service
    container_name: healthia-ai-service
    depends_on:
      - mongodb
    ports:
      - "8001:8001"
    environment:
      AI_SERVICE_ENVIRONMENT: docker
      AI_SERVICE_MONGO_ENABLED: "true"
      AI_SERVICE_MONGO_URI: mongodb://root:rootpassword@mongodb:27017
      AI_SERVICE_MONGO_DB: healthia
      AI_SERVICE_MONGO_TIMEOUT_MS: 1200
      AI_SERVICE_SERVICE_TOKEN: local-service-token

  api:
    build:
      context: ./services/api
    container_name: healthia-api
    depends_on:
      - mongodb
      - ai-service
    ports:
      - "13000:3000"
    environment:
      API_PORT: 3000
      MONGO_URI: mongodb://root:rootpassword@mongodb:27017/healthia?authSource=admin
      JWT_SECRET: development-secret
      JWT_EXPIRES_IN: 15m
      AI_SERVICE_URL: http://ai-service:8001
      AI_SERVICE_TOKEN: local-service-token

volumes:
  mongodb_data:
    driver: local
